[project]
name = "blender-robot-render"
version = "0.1.0"
description = "Photoreal Blender renders of graph-as-policy LIBERO trials"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bpy>=4.5,<4.6",
    "numpy>=1.24,<2",
    "Pillow>=10",
    "pyyaml>=6",
    "imageio[ffmpeg]>=2.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["render"]

[tool.uv]
package = true
